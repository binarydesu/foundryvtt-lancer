# Publishes a release of the fork when a version tag is pushed (ADR-0003).
# The tag is the version itself, fork.<upstream base>.<n>; scripts/version.mjs describes the scheme. Upstream's tags
# (v3.1.3 and so on) also exist in this repository, and they do not match the trigger.
# The release is published and marked latest at once, because every installation updates from the manifest URL
# releases/latest/download/system.json. Drafts and prereleases are invisible there.
name: Release

on:
  push:
    tags: ["fork.*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish ${{ github.ref_name }}
    if: github.repository == 'binarydesu/foundryvtt-lancer'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ github.ref_name }}
      ZIP: lancer-${{ github.ref_name }}.zip
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Check that src/system.json belongs to this tag
        run: node scripts/version.mjs verify "$TAG"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check that the built manifest belongs to this tag
        run: node scripts/version.mjs verify "$TAG" dist/system.json

      - name: Package
        run: cd dist && zip -qr "../$ZIP" .

      # A published version never changes: the action fails if a release for this tag already exists.
      - name: Publish the release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          artifacts: dist/system.json,${{ env.ZIP }}
          makeLatest: "true"
          body: |
            Lancer for Foundry VTT, binarydesu fork. The version names the upstream Lancer release it is based on.

            Manifest URL to install and update this fork:
            https://github.com/binarydesu/foundryvtt-lancer/releases/latest/download/system.json

            A personal fork: not listed in Foundry's package directory, and without support.
